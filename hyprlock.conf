general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

# Time
label {
    monitor =
    text = $TIME
    color = rgb(ffffff)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %d %B %Y"
    color = rgb(cccccc)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 250, 40
    outline_thickness = 1

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgb(89b4fa)
    inner_color = rgb(0f0f16)
    font_color = rgb(ffffff)

    fade_on_empty = false

    placeholder_text = <span>󰌾  Password</span>

    position = 0, -50
    halign = center
    valign = center
}
